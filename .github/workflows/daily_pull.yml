name: Daily Job Pull (Apify)

on:
  schedule:
    - cron: '0 9 * * 1-5'   # Mon–Fri 9 AM UTC (2:30 PM IST / 4 AM CST)
  workflow_dispatch:          # manual trigger from GitHub UI

jobs:
  pull-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Apify job scraper
        run: node scripts/pull_jobs.js
        env:
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}

      - name: Show results summary
        run: |
          node -e "
            const jobs = JSON.parse(require('fs').readFileSync('data/jobs.json','utf8'));
            const log  = JSON.parse(require('fs').readFileSync('data/pull_log.json','utf8'));
            const last = log[0];
            console.log('=== PULL SUMMARY ===');
            console.log('New jobs:   ', last.newJobs);
            console.log('Total jobs: ', last.totalJobs);
            console.log('USA jobs:   ', last.usaJobs);
            console.log('India jobs: ', last.indiaJobs);
            console.log('Sources:    ', last.sources.join(', '));
            console.log('Status:     ', last.status);
            console.log('');
            console.log('By title category:');
            Object.entries(last.byCategory).forEach(([k,v])=>console.log(' ',k.padEnd(36),v));
          "

      - name: Commit job data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/pull_log.json data/archived_jobs.json
          if git diff --staged --quiet; then
            echo "No changes — 0 new jobs found today"
          else
            NEW=$(node -e "const l=JSON.parse(require('fs').readFileSync('data/pull_log.json'));console.log(l[0].newJobs)")
            TOT=$(node -e "const l=JSON.parse(require('fs').readFileSync('data/pull_log.json'));console.log(l[0].totalJobs)")
            git commit -m "jobs: $(date +'%Y-%m-%d') — ${NEW} new, ${TOT} total [Indeed+Naukri]"
            git push
            echo "Pushed $NEW new jobs"
          fi
